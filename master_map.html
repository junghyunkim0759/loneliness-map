if(active==='B'){view.innerHTML='<h2>이론의 차이와 확인된 인용</h2><p class="hint">위쪽은 연구 접근의 비교입니다. 직접 계승선은 확인하지 못한 곳에 만들지 않았습니다. 아래 네트워크는 실제 기탁된 참고문헌 DOI 연결만 보여줍니다.</p><div class="grid">'+DATA.nodes.filter(n=>n.type==='이론').map(card).join('')+'</div><h3>선정 문헌 내부의 인용 연결</h3><label>중심 문헌 <select id="citefocus" aria-label="인용 네트워크 중심 문헌">'+DATA.references.filter(r=>r.id.startsWith('L')).map(r=>`<option value="${r.id}" ${r.id==='L042'?'selected':''}>${r.id} · ${esc(r.title.slice(0,70))}</option>`).join('')+'</select></label><div id="net" class="network"></div><p class="muted">화살표: 인용한 문헌 → 인용된 문헌. 참고문헌 메타데이터 누락·비DOI 자료·선정 밖 문헌은 표시하지 않습니다. 전체 학계의 인용망이나 중요도 순위가 아닙니다.</p>';drawNetwork('L042');document.getElementById('citefocus').onchange=e=>drawNetwork(e.target.value);}
if(active==='D'){view.innerHTML='<h2>주장별 근거 수준과 제한</h2><p class="hint">A–F는 이 지도의 잠정 분류입니다. 논문 전체의 품질 등급이나 GRADE를 대체하지 않습니다. 철학·역사 해석은 경험과학과 다른 기준으로 읽습니다.</p><div class="empty"><b>A · 비교적 확립됨</b><br>이번 초기 조사에서는 정식 근거평가가 없어 강한 판정을 유보했습니다.</div><div class="grid">'+DATA.nodes.filter(n=>n.type==='발견').map(card).join('')+'</div><h3>C · 현재의 논쟁</h3><div class="grid">'+DATA.nodes.filter(n=>n.type==='논쟁').map(card).join('')+'</div><div class="notice">E는 저자들이 명시한 미해결 문제, F는 AI의 공백 후보입니다. 지도 E에서 구분해 확인합니다.</div>';}
if(active==='E'){view.innerHTML='<h2>어디에 다음 질문을 놓을 것인가</h2><p class="hint">검색되지 않음 ≠ 연구 부족 ≠ 설명되지 않음. 우선순위는 AI의 작업 제안이며, 2차 조사는 자동 실행되지 않습니다.</p><div class="grid">'+DATA.nodes.filter(n=>n.type==='연구 질문').sort((a,b)=>a.priority.localeCompare(b.priority)).map(n=>card(n).replace('<article class="card">',`<article class="card"><span class="tag ${n.grade==='F'?'ai':''}">우선순위 ${n.priority} · ${n.grade==='E'?'저자 명시':'AI 공백 후보'}</span>`)).join('')+'</div><div class="notice">권장 순서: 개념·원전 → 문화·번역 → 측정·시간축 → 한정된 중재·인과 질문 → 필요 시 인용망 확장</div>';}
show(focus);}
function drawNetwork(id){const edges=DATA.edges.filter(e=>e.relation==='실제 문헌 인용'&&(e.source===id||e.target===id));const incoming=[...new Set(edges.filter(e=>e.target===id).map(e=>e.source))],outgoing=[...new Set(edges.filter(e=>e.source===id).map(e=>e.target))];const h=Math.max(300,Math.max(incoming.length,outgoing.length)*68+80),cy=h/2;let s=`<svg xmlns="http://www.w3.org/2000/svg" width="980" height="${h}" viewBox="0 0 980 ${h}"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0e757b"/></marker></defs><text x="35" y="25">이 문헌을 인용한 선정 문헌</text><text x="690" y="25">이 문헌이 인용한 선정 문헌</text>`;
const box=(k,x,y)=>`<g data-node="${k}" tabindex="0" role="button" aria-label="${esc(refs.get(k).title)}"><rect x="${x}" y="${y-22}" width="265" height="48" rx="4" fill="${k===id?'#dceff0':'#f0f5f6'}" stroke="#b8cfd5"/><text x="${x+10}" y="${y-3}">${k} · ${esc(refs.get(k).year)}</text><text x="${x+10}" y="${y+15}">${esc(refs.get(k).title.slice(0,29))}…</text></g>`;
incoming.forEach((k,i)=>{let y=65+i*68;s+=`<path d="M300 ${y} C340 ${y} 330 ${cy} 355 ${cy}" stroke="#0e757b" fill="none" marker-end="url(#arrow)"/>`+box(k,35,y)});outgoing.forEach((k,i)=>{let y=65+i*68;s+=`<path d="M620 ${cy} C655 ${cy} 650 ${y} 685 ${y}" stroke="#0e757b" fill="none" marker-end="url(#arrow)"/>`+box(k,690,y)});s+=box(id,355,cy);if(!edges.length)s+=`<text x="350" y="${cy+65}">현재 확보한 작은 문헌군에서 연결 미확인</text>`;document.getElementById('net').innerHTML=s+'</svg>';}
document.addEventListener('click',e=>{let b=e.target.closest('[data-node]');if(b)show(b.dataset.node);let t=e.target.closest('[data-view]');if(t){active=t.dataset.view;render()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-node]')){e.preventDefault();show(e.target.dataset.node)}});
search.addEventListener('input',()=>{let q=search.value.trim().toLowerCase();if(!q){render();return}const matches=DATA.nodes.filter(n=>(n.id+' '+n.label+' '+n.description+' '+(n.original||'')+' '+(n.authors||'')+' '+(n.researchers||'')).toLowerCase().includes(q));view.innerHTML=`<h2>검색 결과 ${matches.length}개</h2><p class="hint">지도와 문헌 DB의 공통 ID를 검색합니다. 검색어를 지우면 이전 보기로 돌아갑니다.</p><div class="grid">${matches.map(card).join('')}</div>`});
document.getElementById('footer').textContent=`공통 데이터: ${DATA.stats.nodes}개 노드 · ${DATA.stats.edges}개 연결(분류·저술 포함) · 실제 DOI 인용 ${DATA.stats.citation_edges}개. 노드 수는 연구 성숙도나 지식의 양이 아닙니다.`;
render();
</script></body></html>
